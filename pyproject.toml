[project]
name = "projeto-analise-vendas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fabiano Ferreira", email = "estudarpos.nascimento@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
]

[project.scripts]
projeto-analise-vendas = "projeto_analise_vendas:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs-material>=9.8.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
